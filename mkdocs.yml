site_name: Tenda Peppers Knowledge Hub
site_url: https://docs.drychillis.com/
site_description: >-
  Official technical documentation for paprika and dried chilli sourcing — ASTA colour value,
  Scoville Heat Units (SHU), Chinese chilli varieties, applications and import guidance.

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    primary: red
    accent: amber
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Buying Guide:
      - Paprika & Chilli Buying Guide: buying-guide/index.md
  - Specifications:
      - ASTA Colour & SHU Explained: asta-shu-explained/index.md
      - Chilli Varieties & Grades: chilli-varieties/index.md
      - Paprika Origins Compared: paprika-origins/index.md
      - Organic vs Conventional: organic-vs-conventional/index.md
      - Colour Change & Storage: colour-storage/index.md
      - Heat Perception & Palate: heat-perception/index.md
      - Chilli Heat Level Reference: heat-level-reference/index.md
      - Quality Control: quality-control/index.md
      - Buyer Specification Template: specification-template/index.md
  - Applications:
      - Applications & Formulation: applications/index.md
  - Import & Supply:
      - Importing & Supply Chain: importing/index.md
      - Shipping & Customs: shipping-and-customs/index.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
        - locale: es
          name: Español
          nav_translations:
            Home: Inicio
            Buying Guide: Guía de Compra
